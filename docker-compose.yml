services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sift-postgres

    environment:
      POSTGRES_DB: sift
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5435:5432"

    volumes:
      - sift_pg_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sift"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sift_pg_data: